<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings: character set and a phone-friendly viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | PocketPlan</title>

  <!-- Metadata: describes the page for browsers and search engines -->
  <meta name="description" content="PocketPlan: a colourful student expense tracker.">
  <meta name="keywords" content="expense tracker, budget, student, PocketPlan">
  <meta name="author" content="Allysa">
  <meta name="theme-color" content="#FFC1DC">

  <!-- Logo shown in the browser tab -->
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Styles: Bootstrap 5 framework, the Inter font, then our own stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
  <!-- Navigation (header and menu): built by js/layout.js -->
  <div id="nav"></div>

  <div class="wrap">
    <main>
      <h1 class="title">Your pocket</h1>

      <section class="bento" aria-label="Spending overview">
        <!-- 1. Starter guide for new users (js/dashboard.js fills it in) -->
        <div class="pc s6 guide" id="guide"></div>

        <!-- 2. Balance, progress meter, mood message and monthly limit box -->
        <div class="pc y s6" id="hero"></div>

        <!-- 3. Spending so far for each category -->
        <div class="s6 cats" id="catTiles"></div>

        <!-- 4. Charts (ApexCharts): spending by category and spending per week -->
        <div class="pc s3"><h2 class="h5">Where it goes</h2><div id="donutChart"></div></div>
        <div class="pc s3"><h2 class="h5">Spend each week (RM)</h2><div id="barChart"></div></div>

        <!-- 5. Summary tiles: entries, biggest category, average per entry -->
        <div class="s6 tiles" id="tiles"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="foot foot-mini">&copy; 2026 PocketPlan</footer>
  </div>

  <!-- Scripts: charts library first, then shared data, navigation and this page's script (order matters) -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.0"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
