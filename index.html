<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings: character set and a phone-friendly viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PocketPlan</title>

  <!-- Metadata: describes the page for browsers and search engines -->
  <meta name="description" content="PocketPlan: a colourful student expense tracker.">
  <meta name="keywords" content="expense tracker, budget, student, PocketPlan">
  <meta name="author" content="Allysa">
  <meta name="theme-color" content="#FFC1DC">

  <!-- Logo shown in the browser tab -->
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Styles: Bootstrap 5 framework, the Inter font, then our own stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
  <!-- Login page: log in, sign up and forgot password share one card (all simulated, no database) -->
  <main class="login">

    <!-- Left side: welcome message with floating bubbles -->
    <section class="lhero" aria-label="Welcome">
      <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      <img class="hero-logo" src="images/logo.svg" alt="PocketPlan logo" width="84" height="84">
      <p class="eyebrow">PocketPlan</p>
      <h1>Know where <mark>your RM</mark> goes.</h1>
      <p class="lead">Log every spend, see it in colour, stay on budget.</p>
    </section>

    <!-- Right side: the forms -->
    <section class="lform" aria-label="Account">
      <div class="pc">
        <h2 class="mb-1" id="formTitle">Welcome back</h2>
        <p class="text-muted mb-3" id="formDesc">Log in to open your pocket.</p>

        <!-- Tabs to switch between Log in and Sign up -->
        <div class="tabs" role="group" aria-label="Log in or sign up">
          <button type="button" id="tabLogin" class="chip on">Log in</button>
          <button type="button" id="tabSignup" class="chip">Sign up</button>
        </div>

        <!-- Error and success messages appear here (js/login.js) -->
        <div id="loginError" class="alert d-none" role="alert"></div>

        <!-- 1. Log in form -->
        <form id="loginForm" novalidate>
          <label for="user" class="form-label fw-bold">Username</label>
          <input id="user" class="form-control mb-3" autocomplete="username">
          <label for="pass" class="form-label fw-bold">Password</label>
          <input id="pass" type="password" class="form-control mb-2" autocomplete="current-password">
          <div class="forgot-row"><button type="button" id="goForgot" class="linkbtn">Forgot password?</button></div>
          <button class="btn-go w-100" type="submit">Log in</button>
        </form>

        <!-- 2. Sign up form -->
        <form id="signupForm" class="d-none" novalidate>
          <label for="newUser" class="form-label fw-bold">Choose a username</label>
          <input id="newUser" class="form-control mb-3" autocomplete="username" maxlength="20">
          <label for="newPass" class="form-label fw-bold">Choose a password (at least 6 characters)</label>
          <input id="newPass" type="password" class="form-control mb-3" autocomplete="new-password">
          <label for="newPass2" class="form-label fw-bold">Confirm password</label>
          <input id="newPass2" type="password" class="form-control mb-3" autocomplete="new-password">
          <label for="newWord" class="form-label fw-bold">Recovery word</label>
          <input id="newWord" class="form-control" placeholder="e.g. your pet's name">
          <div class="form-text mb-4">You need this word to reset your password if you forget it. Pick something only you know.</div>
          <button class="btn-go w-100" type="submit">Create account</button>
        </form>

        <!-- 3. Forgot password form -->
        <form id="forgotForm" class="d-none" novalidate>
          <label for="fUser" class="form-label fw-bold">Username</label>
          <input id="fUser" class="form-control mb-3" autocomplete="username">
          <label for="fWord" class="form-label fw-bold">Recovery word</label>
          <input id="fWord" class="form-control mb-3">
          <label for="fPass" class="form-label fw-bold">New password (at least 6 characters)</label>
          <input id="fPass" type="password" class="form-control mb-3" autocomplete="new-password">
          <label for="fPass2" class="form-label fw-bold">Confirm new password</label>
          <input id="fPass2" type="password" class="form-control mb-4" autocomplete="new-password">
          <button class="btn-go w-100" type="submit">Reset password</button>
          <button type="button" id="backLogin" class="linkbtn mt-3">Back to log in</button>
        </form>
      </div>

      <!-- Footer -->
      <footer class="foot foot-mini">&copy; 2026 PocketPlan</footer>
    </section>
  </main>

  <!-- Scripts: shared data first, then this page's script (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
