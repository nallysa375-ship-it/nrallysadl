<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings: character set and a phone-friendly viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses | PocketPlan</title>

  <!-- Metadata: describes the page for browsers and search engines -->
  <meta name="description" content="PocketPlan: a colourful student expense tracker.">
  <meta name="keywords" content="expense tracker, budget, student, PocketPlan">
  <meta name="author" content="Allysa">
  <meta name="theme-color" content="#FFC1DC">

  <!-- Logo shown in the browser tab -->
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Styles: Bootstrap 5 framework, the Inter font, then our own stylesheet -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="expenses">
  <!-- Navigation (header and menu): built by js/layout.js -->
  <div id="nav"></div>

  <div class="wrap">
    <main>
      <h1 class="title">Expenses</h1>

      <!-- Section 1: form to add a new spend -->
      <section aria-labelledby="addTitle">
        <form id="addForm" class="pc mb-4" novalidate>
          <h2 class="h5" id="addTitle">Add a spend</h2>
          <p class="text-muted small">Every time you pay for something, add it here. It updates your charts and budget.</p>
          <div class="row g-2">
            <div class="col-6 col-md-2">
              <label class="form-label fw-bold" for="fDate">Date</label>
              <input id="fDate" type="date" class="form-control">
              <div class="form-text">Today is filled in</div>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold" for="fItem">Item</label>
              <input id="fItem" class="form-control" placeholder="e.g. Lunch">
              <div class="form-text">What did you buy?</div>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label fw-bold" for="fCat">Category</label>
              <select id="fCat" class="form-select"></select>
              <div class="form-text">Pick the closest one</div>
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label fw-bold" for="fAmt">RM</label>
              <input id="fAmt" type="number" step="0.01" min="0" class="form-control">
              <div class="form-text">How much you paid</div>
            </div>
            <div class="col-12 col-md-2 d-flex align-items-start pt-md-4">
              <button class="btn-go w-100 mt-md-2" type="submit">Add</button>
            </div>
          </div>
          <!-- Green or red message after pressing Add -->
          <div id="formMsg" class="small mt-2" role="status"></div>
        </form>
      </section>

      <!-- Section 2: list of all spends with category filter -->
      <section aria-labelledby="listTitle">
        <h2 class="visually-hidden" id="listTitle">All spends</h2>
        <!-- Filter chips (built by js/expenses.js) -->
        <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
        <div class="pc">
          <table class="tbl">
            <thead>
              <tr><th>Date</th><th>Item</th><th>Category</th><th class="text-end">Amount (RM)</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="foot foot-mini">&copy; 2026 PocketPlan</footer>
  </div>

  <!-- Scripts: shared data, navigation, then this page's script (order matters) -->
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
