<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PocketPlan logo">
  <!-- Two small floating bubbles -->
  <circle cx="53" cy="12" r="4.5" fill="#8EDDC8" stroke="#3D2450" stroke-width="2.5"/>
  <circle cx="11" cy="14" r="3.2" fill="#C7B2FF" stroke="#3D2450" stroke-width="2.5"/>
  <!-- A coin peeking out of the pocket -->
  <circle cx="32" cy="19" r="11" fill="#FFF1A8" stroke="#3D2450" stroke-width="3"/>
  <circle cx="32" cy="19" r="6" fill="none" stroke="#3D2450" stroke-width="1.8" opacity=".55"/>
  <circle cx="27.5" cy="14.5" r="2.2" fill="#fff"/>
  <!-- The pocket -->
  <path d="M9 27 Q9 23 13 23 H51 Q55 23 55 27 V45 Q55 58 42 58 H22 Q9 58 9 45 Z" fill="#FFC1DC" stroke="#3D2450" stroke-width="3" stroke-linejoin="round"/>
  <!-- Stitching along the pocket -->
  <path d="M16 31 H48" stroke="#3D2450" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3.5 4"/>
  <!-- A little smile -->
  <path d="M25 44 Q32 51 39 44" fill="none" stroke="#3D2450" stroke-width="3" stroke-linecap="round"/>
  <circle cx="25" cy="39" r="1.8" fill="#3D2450"/><circle cx="39" cy="39" r="1.8" fill="#3D2450"/>
</svg>